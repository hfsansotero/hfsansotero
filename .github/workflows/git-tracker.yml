# Copy into your profile repository (github.com/<you>/<you>) as .github/workflows/git-tracker.yml
name: git-tracker

on:
  schedule:
    - cron: "5 0 * * *" # every night, just after midnight UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/git-tracker.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch my private sprites
        uses: actions/checkout@v4
        with:
          repository: hfsansotero/My-sprites
          token: ${{ secrets.SPRITES_TOKEN }}
          path: private
      - uses: hfsansotero/git-tracker@main
        with:
          animal: private/dragon # from hfsansotero/My-sprites (private)
          growth: month # size from my last 30 days
          mood: week # animation from my last finished week
      - name: Commit the GIF if it changed
        run: |
          git add tracker
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update git-tracker"
          git push
